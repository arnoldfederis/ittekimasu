<!--
  The Ittekimasu mark, foreground ONLY — a layer for Icon Composer, which draws the ground
  itself from `fill` in icon.json and derives the light, dark, tinted and clear appearances
  from this one artwork. A baked-in background would defeat all four.

  Two tones rather than one, because tinted mode maps luminance to a single hue: cream reads
  near-white and amber reads mid, so the check stays distinguishable from the gate instead of
  merging into a silhouette.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- kasagi: the top beam, overhanging the pillars, with a torii's upward sweep -->
  <path d="M118 242 Q512 164 906 242 L906 316 Q512 250 118 316 Z" fill="#f5f1e6"/>

  <!-- nuki: the second beam -->
  <rect x="212" y="380" width="600" height="88" rx="34" fill="#f5f1e6"/>

  <!-- hashira: the pillars, splayed outward at the base as a real torii is -->
  <path d="M286 316 h150 l-26 470 h-98 Z" fill="#f5f1e6"/>
  <path d="M738 316 h-150 l26 470 h98 Z" fill="#f5f1e6"/>

  <!--
    The check sits in the widest part of the opening, low between the pillars, and is sized
    so its round caps clear both of them. An earlier version spanned the full width and its
    ends merged into the pillars at small sizes — the exact blob problem this icon is
    supposed to avoid.
  -->
  <path
    d="M445 700 l42 44 l92 -102"
    fill="none"
    stroke="#ef9f27"
    stroke-width="60"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
