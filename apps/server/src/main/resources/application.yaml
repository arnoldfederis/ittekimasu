# Base configuration. COMMITTED, and deliberately holds no secrets.
#
# DO NOT let env-sync write this file. It used to be gitignored and generated by
# tools/nix/scripts/env-sync.sh from tools/secrets/apps.local.yaml, and that broke
# everything outside a dev checkout: CI and `docker build` never see a gitignored file,
# so the image shipped with no Spring configuration at all — no datasource, no Flyway
# locations, Tomcat on 8080 instead of 4000.
#
# The split now mirrors apps/mobile exactly:
#
#   this file                → structure and non-secret defaults, in git
#   application-local.yaml   → local dev values only, gitignored, written by env-sync
#   environment variables    → production values, injected by Dokploy from the stack .env
#
# Anything genuinely secret is `${VAR}` with an EMPTY default, so a missing value fails
# loudly rather than silently running on a placeholder that is committed to git.

spring:
  application:
    name: ittekimasu-server

  # Loaded when present, ignored when not. Local dev gets it from sops; the container
  # image does not contain it, and must not.
  config:
    import: optional:classpath:application-local.yaml

  datasource:
    # The dev defaults are here so a fresh checkout runs against the devbox Postgres with
    # no setup. Production overrides all three from the environment — see docker-compose.yml.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://pg.ittekimasu.dev:5432/ittekimasu?currentSchema=app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      # Sized against Postgres's max_connections and the VPS's 2 vCPU. More connections
      # just move the queue from the app, where it is visible, into the database, where
      # it is not.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}

  jpa:
    hibernate:
      # Hibernate NEVER generates schema. Flyway owns it; this only checks the two agree.
      ddl-auto: validate
    # ON locally, OFF in production via SPRING_JPA_SHOW_SQL — in a container every query
    # becomes a log line, which is exactly the unbounded growth that fills a small disk.
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        default_schema: app
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
    open-in-view: false

  flyway:
    enabled: true
    # "migrations", plural. Flyway's default is db/migration and finds nothing here.
    locations: classpath:db/migrations
    schemas: app
    default-schema: app

  # Virtual threads: one per request instead of borrowing from Tomcat's pool of 200
  # platform threads, each reserving ~1 MB of stack whether or not it is doing anything —
  # real memory in a 1408 MB container.
  #
  # Safe here specifically because this is Java 25. Until JDK 24 a virtual thread entering
  # a `synchronized` block pinned its carrier, and a blocking JDBC call inside one could
  # starve the pool; JEP 491 removed that, and HikariCP and pgJDBC are full of them.
  #
  # This does NOT raise throughput on its own — Hikari's pool is still the real limit, so
  # extra concurrent requests wait on a connection rather than on a thread. The win is
  # memory and the absence of a thread-pool ceiling.
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

  web:
    error:
      whitelabel:
        enabled: false

server:
  port: ${SERVER_PORT:4000}
  # Finish in-flight requests before exiting, so a redeploy does not cut a review
  # submission in half.
  shutdown: graceful

# Health only, and no details. SecurityConfig permits /actuator/health unauthenticated so
# the container healthcheck can reach it — anything richer would publish the database
# host, the disk usage and the state of every dependency to the internet.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

firebase:
  # classpath: locally (the file is gitignored), file:/run/secrets/... in the container.
  # See docker-compose.yml for how it gets there.
  service-account-location: ${FIREBASE_SERVICE_ACCOUNT_LOCATION:classpath:firebase-config.json}

onesignal:
  # The App ID is public and already ships inside the mobile bundle.
  app-id: ${ONESIGNAL_APP_ID:316e60bc-84d6-47f1-99da-e6304d638b26}
  # EMPTY default. This key can push to every user you have; a hardcoded fallback means a
  # missing environment variable silently keeps working with a key that is in git.
  rest-api-key: ${ONESIGNAL_REST_API_KEY:}
  # Newer OneSignal keys authenticate as "Key <token>", older ones as "Basic <token>".
  # Wrong scheme is a silent 401, so it is configurable rather than assumed.
  auth-scheme: ${ONESIGNAL_AUTH_SCHEME:Key}

revenuecat:
  # EMPTY default, on purpose. /api/webhooks/** is the only unauthenticated route, so this
  # string is the entire door, and RevenueCatWebhookController rejects everything when it
  # is unset. The old baked-in default quietly undid that "fails closed" guarantee.
  webhook-authorization: ${REVENUECAT_WEBHOOK_AUTHORIZATION:}

# API documentation. On locally, off in production — it is a map of every route.
scalar:
  enabled: ${SCALAR_ENABLED:true}
  url: /v3/api-docs
  path: /api-docs

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
