http:
  routers:
    traefik:
      entryPoints:
        - websecure
      rule: "Host(`traefik.ittekimasu.dev`)"
      service: traefik
      tls:
        options: ittekimasu
        domains:
          - main: "ittekimasu.dev"
    server:
      entryPoints:
        - websecure
      rule: "Host(`server.ittekimasu.dev`)"
      service: server
      tls:
        options: ittekimasu
        domains:
          - main: "ittekimasu.dev"

  services:
    traefik:
      loadbalancer:
        servers:
          - url: "http://localhost:9092"
    server:
      loadbalancer:
        servers:
          - url: "http://localhost:4000"
tls:
  stores:
    default:
      defaultCertificate:
        certFile: ./tools/certs/ittekimasu.dev.pem
        keyFile: ./tools/certs/ittekimasu.dev-key.pem
  options:
    ittekimasu:
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
