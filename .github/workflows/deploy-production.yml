name: Deploy Production

# No event-controlled text (commit messages, PR titles, branch names) reaches any
# `run:` block. Every value a step shell touches is bound through `env:` and referenced
# as "$VAR" rather than interpolated inline — keep it that way when adding steps.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same gate as the PR workflow. A push to main that skipped review still has to prove
  # the suite passes before an image is built from it.
  test:
    name: Server — test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: ittekimasu
          POSTGRES_PASSWORD: ittekimasu
          POSTGRES_DB: ittekimasu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ittekimasu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Fabricate a Firebase service account
        # See ci.yml for why this is generated rather than kept as a repository secret.
        run: |
          set -euo pipefail
          mkdir -p apps/server/src/test/resources
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ci-key.pem 2>/dev/null
          jq -n --rawfile key /tmp/ci-key.pem '{
            type: "service_account",
            project_id: "ittekimasu-ci",
            private_key_id: "ci",
            private_key: $key,
            client_email: "ci@ittekimasu-ci.iam.gserviceaccount.com",
            client_id: "0",
            auth_uri: "https://accounts.google.com/o/oauth2/auth",
            token_uri: "https://oauth2.googleapis.com/token"
          }' > apps/server/src/test/resources/firebase-config.json

      - name: Test
        working-directory: apps/server
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ittekimasu?currentSchema=app
          SPRING_DATASOURCE_USERNAME: ittekimasu
          SPRING_DATASOURCE_PASSWORD: ittekimasu
        run: ./mvnw -B test

  changes:
    name: Detect changed apps
    needs: test
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Only `server`, because only the server deploys from here. The copied version
          # declared site/web/worker outputs with no matching filters — those are always
          # empty, so any `if:` reading them is dead code. The mobile app ships through
          # EAS and the App Store, not this workflow.
          filters: |
            server:
              - 'apps/server/**'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'

  build-server:
    name: Build & push server image
    needs: [test, changes]
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo owner
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          # Both tags. `latest` is what the compose file pulls by default; the SHA tag
          # is what makes rollback possible — set IMAGE_TAG to a previous SHA in
          # Dokploy's environment and redeploy, instead of rebuilding an old commit.
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/ittekimasu-server:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/ittekimasu-server:${{ github.sha }}
          cache-from: type=gha,scope=ittekimasu-server-production
          cache-to: type=gha,mode=max,scope=ittekimasu-server-production
          provenance: false

  deploy:
    name: Redeploy on Dokploy
    needs: [changes, build-server]
    # Only when an image was actually built. The copied version used
    # `always() && !failure() && !cancelled()`, which also fires when build-server is
    # SKIPPED — so a mobile-only commit redeployed production for nothing, pulling
    # `latest` and restarting the API in the middle of whatever was in flight.
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Trigger redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "${DOKPLOY_URL}/api/compose.redeploy" \
            -H "x-api-key: ${DOKPLOY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg sha "$SHA" \
              '{composeId: $id, title: ("Deploy " + $sha), description: "Automated deploy from GitHub Actions"}')"

      - name: Wait for the API to come back
        # A 200 from compose.redeploy only means Dokploy accepted the request. Without
        # this, a container that crash-loops on a bad Flyway migration reports as a
        # green deploy and you hear about it from a user instead. The compose file's
        # start_period is 90s because migrations run first, so allow well past that.
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "PRODUCTION_HEALTH_URL not set — skipping verification."
            echo "Add it (e.g. https://api.ittekimasu.app/actuator/health) to make this gate real."
            exit 0
          fi
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 "$HEALTH_URL" | grep -q '"status":"UP"'; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::API did not report UP within ~7 minutes of the redeploy."
          exit 1
